<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <title>OnePost Vinted Poster</title>
  <style>
    body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 18px; width: 380px; color: #1C1A17; background: #F5F1EA; }
    h1 { font-size: 17px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
    .mark { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: #2F5D50; color: #fff; font-size: 13px; font-weight: 800; }
    p { color: #6F685E; margin: 0 0 14px; }
    label { display: block; font-weight: 600; font-size: 12px; color: #6F685E; margin: 12px 0 4px; }
    input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #E4DDD1; border-radius: 9px; background: #fff; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 10px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; background: #2F5D50; color: #fff; }
    button.ghost { background: #E3ECE7; color: #2F5D50; }
    .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-weight: 600; }
    #status { margin-top: 10px; min-height: 18px; font-weight: 600; color: #2F5D50; }
    #logs { margin-top: 12px; background: #fff; border: 1px solid #E4DDD1; border-radius: 10px; padding: 8px 10px; max-height: 200px; overflow: auto; font-size: 12px; white-space: pre-wrap; color: #3d3a35; }
    .hint { font-size: 12px; color: #6F685E; margin-top: 4px; }
  </style>
</head>
<body>
  <h1><span class="mark">1</span>OnePost Vinted Poster</h1>
  <p>Posts approved items to the Vinted account logged in to this Chrome profile.</p>

  <label for="server">OnePost address</label>
  <input type="text" id="server" />
  <label for="token">Worker token</label>
  <input type="password" id="token" placeholder="From Railway: WORKER_TOKEN" />

  <label for="mode">Posting mode</label>
  <select id="mode">
    <option value="review">Review: fill the form, I press Upload</option>
    <option value="auto">Automatic: fill and upload</option>
  </select>
  <div class="hint">Start on Review for the first few items, then switch to Automatic.</div>

  <div class="check"><input type="checkbox" id="paused" /><label for="paused" style="margin:0;color:#1C1A17">Pause posting</label></div>

  <div class="row">
    <button id="save">Save</button>
    <button id="test" class="ghost">Test connection</button>
    <button id="now" class="ghost">Check now</button>
  </div>
  <div id="status"></div>
  <div id="logs">No activity yet.</div>
  <script src="options.js"></script>
</body>
</html>
